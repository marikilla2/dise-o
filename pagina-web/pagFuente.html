<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo de Fuente WOFF</title>

  <!-- Se puede hacer en un fichero css aparte -->
  <!-- <link rel="stylesheet" href="estilos.css"> -->
   
  <!-- O se puede hacer en fichero html directamente -->
  <style>
    /* Definición de la fuente */
    @font-face {
      font-family: 'MiFuente';
      src: url('sw4zm-wnhw3.woff') format('woff');
    }

    /* Aplicación de la fuente a todo el documento */
    body {
      font-family: 'MiFuente', sans-serif;
    }

  </style>
</head>
<body>
  <h1>Texto con mi fuente personalizada</h1>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>google fonts</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=poppins:wght@300;400;700&display=swap');

        body {
            font-family: "roboto", sans-serif;
            margin: 40px;
            background-color: #f2f2f2;
        }

        h1 {
            font-weight: 700;
        }

        p {
            font-weight: 300;
        }

        .poppins {
            font-family: "poppins", sans-serif;
        }

        .negrita {
            font-weight: 700;
        }
    </style>

</head>

<body>

    <h1>mi página con google fonts</h1>

    <p>esta página utiliza diferentes fuentes de google fonts.</p>

    <p>este texto utiliza roboto con un peso ligero.</p>

    <p class="negrita">este texto utiliza roboto en negrita.</p>

    <h2 class="poppins">otra fuente</h2>

    <p class="poppins">este texto utiliza la fuente poppins mediante @import.</p>

    <p class="poppins negrita">este texto utiliza poppins en negrita.</p>

</body>

</html>
